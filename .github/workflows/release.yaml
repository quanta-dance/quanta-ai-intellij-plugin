name: Build & Publish IntelliJ Plugin

on:
  push:
    tags:
      # Trigger on semantic version tags without 'v' prefix, e.g., 1.2.3 or 1.2.3-beta1
      - "*.*.*"
      - "*.*.*-*"

permissions:
  contents: write

concurrency:
  group: intellij-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate release version
        shell: bash
        run: |
          set -euo pipefail

          TAG_VERSION="$GITHUB_REF_NAME"
          PLUGIN_VERSION="$(sed -n 's/^version=//p' gradle.properties | head -n 1)"

          if [[ -z "$PLUGIN_VERSION" ]]; then
            echo "Could not read version from gradle.properties"
            exit 1
          fi

          if [[ "$TAG_VERSION" != "$PLUGIN_VERSION" ]]; then
            echo "Tag version '$TAG_VERSION' does not match plugin version '$PLUGIN_VERSION'"
            exit 1
          fi

          echo "Validated release version: $PLUGIN_VERSION"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Check formatting
        run: ./gradlew spotlessCheck --no-daemon

      - name: Run tests
        run: ./gradlew test --no-daemon

      - name: Build plugin
        run: ./gradlew buildPlugin --no-daemon

      - name: Run IntelliJ Plugin Verifier
        run: ./gradlew verifyPlugin --no-daemon

      - name: Locate plugin artifact
        id: plugin_zip
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$(sed -n 's/^version=//p' gradle.properties | head -n 1)"
          FILE="build/distributions/intellij-quanta-ai-plugin-${VERSION}.zip"

          if [[ ! -f "$FILE" ]]; then
            echo "Expected plugin artifact was not produced: $FILE"
            find build/distributions -maxdepth 1 -type f -print || true
            exit 1
          fi

          echo "file=$FILE" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: ${{ steps.plugin_zip.outputs.file }}
          generate_release_notes: true

  publish_to_marketplace:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Publish to JetBrains Marketplace
        env:
          JETBRAINS_API_TOKEN: ${{ secrets.JETBRAINS_API_TOKEN }}
        run: ./gradlew publishPlugin --no-daemon