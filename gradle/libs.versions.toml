[versions]
# libraries
junit = "4.13.2"

# plugins
kotlin = "2.2.0"
intellij-platform = "2026.1.1"
# https://github.com/JetBrains/intellij-platform-gradle-plugin
intellij-gradle-plugin = "2.16.0"
# https://mvnrepository.com/artifact/com.jetbrains.fleet/rpc-compiler-plugin/versions
intellij-rpc-plugin = "2.2.0-0.1"
kotlin-serialization = "1.11.0"
byte-buddy = "1.17.8"
ktor = "3.1.3"

[libraries]
junit = { group = "junit", name = "junit", version.ref = "junit" }
kotlin-serialization-core-jvm = { module = "org.jetbrains.kotlinx:kotlinx-serialization-core-jvm", version.ref = "kotlin-serialization" }
kotlin-serialization-json-jvm = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json-jvm", version.ref = "kotlin-serialization" }
javazoom = { group = "javazoom", name = "jlayer", version = "1.0.1" }
openai = { group = "com.openai", name = "openai-java", version = "4.35.0" }
byte-buddy = { group = "net.bytebuddy", name = "byte-buddy", version.ref = "byte-buddy" }
byte-buddy-agent = { group = "net.bytebuddy", name = "byte-buddy-agent", version.ref = "byte-buddy" }
ktor-client-java = { group = "io.ktor", name = "ktor-client-java", version.ref = "ktor" }

[plugins]
intellij-platform = { id = "org.jetbrains.intellij.platform", version.ref = "intellij-gradle-plugin" }
kotlin = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
rpc = { id = "rpc", version.ref = "intellij-rpc-plugin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }